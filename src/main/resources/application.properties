# ============================================================
# APPLICATION
# ============================================================
spring.application.name=event-management-backend
server.port=8081
server.servlet.context-path=/api

# ============================================================
# DATABASE — MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/event_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Harshabs_13
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.pool-name=EventMgmtPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ============================================================
# JWT CONFIGURATION
# ============================================================
# Secret key — MUST be at least 256 bits (32 chars) for HS256
# IMPORTANT: Change this in production and load from env variable
app.jwt.secret=ThisIsAVerySecretKeyForJWTTokenGenerationEventMgmt2024!
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 hours

# ============================================================
# FILE STORAGE — QR Codes & Certificates
# ============================================================
app.file.qr-code-dir=src/main/resources/static/qr-codes/
app.file.certificate-dir=src/main/resources/static/certificates/
app.file.base-url=http://localhost:8081/api

# ============================================================
# MULTIPART (file upload limits)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# LOGGING
# ============================================================
logging.level.com.eventmgmt=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# JACKSON (JSON serialization)
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================================
# WEBSOCKET
# ============================================================
app.websocket.endpoint=/ws
app.websocket.topic.attendance=/topic/attendance